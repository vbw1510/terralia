<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#7cc456">
<meta name="screen-orientation" content="landscape">
<title>Terrália Farm</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#6cc357">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Terrália Farm">
<link rel="icon" type="image/png" href="assets/icones/favicon.png">
<link rel="apple-touch-icon" href="assets/icones/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="cena"></canvas>
<div id="carregando"><div class="car-caixa"><div class="car-logo">Terrália <span>Farm</span></div><div class="car-txt"></div><div class="car-barra"><i></i></div><div class="car-dica"></div></div></div>
<script>
(function(){
  var D=['Arraste a semente por cima de vários canteiros de uma vez!','Toque nos cercados para ouvir os bichinhos 🐄','Ajudar fazendas de amigos dá moedas e XP','Anuncie suas vendas da banca no chat 📢','Materiais de ampliação caem ao colher e produzir','Na cooperativa vocês pedem e doam itens entre si'];
  var el=document.getElementById('carregando'), barra=el.querySelector('i'), p=0, t=null;
  window.mostrarCarregando=function(txt){ el.querySelector('.car-txt').textContent=txt; el.querySelector('.car-dica').textContent='💡 '+D[Math.floor(Math.random()*D.length)]; el.classList.add('on'); clearInterval(t); t=setInterval(function(){ p+=(92-p)*.06; barra.style.width=p+'%'; },60); };
  window.esconderCarregando=function(){ clearInterval(t); barra.style.width='100%'; setTimeout(function(){ el.classList.add('saindo'); setTimeout(function(){ el.classList.remove('on','saindo'); },450); },250); };
  try{ var txt=sessionStorage.getItem('terralia-indo'); if(txt){ p=35; window.mostrarCarregando(txt); } }catch(e){}
})();
</script>
<div id="girar"><div class="cel"></div>Gire o celular<small>Terrália Farm é jogado na horizontal</small></div>

<!-- Tela inicial -->
<div id="splash">
  <div class="conta-splash" id="contaSplash"></div>
  <div class="splash-logo">Terrália <span>Farm</span></div>
  <div class="splash-baixo">
    <button class="btn-jogar" id="btnJogar">JOGAR</button>
    <button class="btn-instalar" id="btnInstalar">📲 Baixar o jogo no celular</button>
    <div class="baixar-painel" id="painelBaixar"></div>
    <p class="splash-sub">Plante, colha e cuide da sua fazenda</p>
  </div>
</div>

<div class="tela-login" id="telaLogin"><div class="lg-caixa"><div class="lg-logo">Terrália <span>Farm</span></div><div id="lgCorpo"></div></div></div>
<div class="faixa-conta" id="faixaConta">⚠️ Seu progresso está só neste aparelho. <b>Conectar conta</b><span class="fc-x">✕</span></div>
<div class="modal-inst" id="modalInst"><div class="mi-caixa"><button class="mi-x" id="miFechar">✕</button><div class="mi-tit">📲 Terrália Farm no seu celular</div><div class="mi-corpo" id="miCorpo"></div></div></div>

<!-- Topo -->
<div class="topo">
  <div class="perfil" data-abrir="perfil">
    <div class="avatar"><img id="avatarImg" src="assets/img/fazendeiro.jpg" alt=""></div>
    <div class="estrela" data-icone="estrela"><span id="nivel">1</span></div>
    <div class="xp"><div class="xpbar"><i id="xpbar"></i></div><span id="xptxt"></span></div>
  </div>
  <div class="topo-dir">
    <div class="pill" id="chipMoedas"><span class="pill-ico" data-icone="moeda"></span><b id="moedas">0</b><button class="mais" data-abrir="loja">+</button></div>
    <button class="redondo" data-abrir="config" data-icone="engrenagem" aria-label="Configurações"></button>
  </div>
</div>

<!-- Botões laterais (agrupados: tocar abre os itens do grupo) -->
<div class="lateral">
  <div class="grupo">
    <button class="mini" data-grupo="visao" aria-label="Visão"><span class="txt-ico">🎥</span><small>Visão</small></button>
    <div class="flyout" id="fly-visao">
      <button class="mini" id="btnGirar" aria-label="Girar visão"><span class="txt-ico">⟳</span><small>Girar</small></button>
      <button class="mini" id="btnCentro" aria-label="Centralizar"><span data-icone="alvo"></span><small>Centro</small></button>
    </div>
  </div>
  <div class="grupo">
    <button class="mini" data-grupo="social" aria-label="Social"><span class="txt-ico">👥</span><small>Social</small><b class="badge" id="badgeSocial"></b></button>
    <div class="flyout" id="fly-social">
      <button class="mini" data-abrir="amigos"><span class="txt-ico">🧑‍🤝‍🧑</span><small>Amigos</small></button>
      <button class="mini" data-abrir="coop"><span class="txt-ico">🤝</span><small>Coop</small></button>
      <button class="mini" data-abrir="banca"><span class="txt-ico">🏪</span><small>Banca</small></button>
      <button class="mini" data-abrir="ranking"><span class="txt-ico">🏆</span><small>Ranking</small></button>
    </div>
  </div>
  <button class="mini" data-abrir="pedidos" aria-label="Pedidos"><span class="txt-ico">🚚</span><small>Pedidos</small></button>
</div>

<!-- Botões de canto -->
<div class="cantos esq">
  <button class="gbtn" data-abrir="loja"><i data-icone="loja"></i><span>Loja</span></button>
  <div class="grupo">
    <button class="gbtn" data-grupo="construir"><i data-icone="martelo"></i><span>Construir</span></button>
    <div class="flyout cima" id="fly-construir">
      <button class="mini" data-abrir="construir"><span class="txt-ico">🏗️</span><small>Construir</small></button>
      <button class="mini" data-abrir="decoracao"><span class="txt-ico">🌸</span><small>Enfeites</small></button>
      <button class="mini" id="btnEditar" aria-label="Editar fazenda"><span data-icone="lapis"></span><small>Editar</small></button>
    </div>
  </div>
</div>
<div class="cantos dir">
  <button class="gbtn" data-abrir="armazem"><i data-icone="caixa"></i><span>Armazém</span><b class="badge" id="badgeArmazem"></b><b class="badge esq" id="badgeAnimais"></b></button>
</div>

<div class="dica-campo" id="dicaCampo"></div>
<div class="missoes" id="missoes"></div>
<div class="vinheta"></div>
<div class="marca-jogo">Terrália <b>Farm</b></div>
<div class="chat" id="chat"></div>
<div class="dica-arr" id="dicaArr"></div>
<div class="tutorial" id="tutorial">
  <div class="tut-avatar"><img src="assets/img/fazendeiro.jpg" alt=""></div>
  <div class="tut-corpo"><div class="tut-nome">Tonho</div><div class="tut-txt"></div>
    <div class="tut-acoes"><button class="link-pular" data-tut="pular">Pular tutorial</button><button class="btn verde" data-tut="prox"></button></div></div>
</div>
<div class="maozinha" id="maozinha">👆</div>
<div class="barra-edicao"><span>✏️ Modo edição · toque numa construção e arraste</span><button class="btn verde" data-ed="concluir">Concluir</button></div>
<div class="ferr-edicao" id="ferrEdicao"><button data-ed="girar" title="Girar">⟳</button><button data-ed="ok" class="ok" title="Confirmar">✓</button><button data-ed="cancelar" class="nao" title="Cancelar">✕</button><button data-ed="vender" class="vend" title="Vender decoração">🗑</button></div>
<div class="hotbar" id="hotbar" style="display:none"></div>
<div class="seletor-sem" id="seletorSem"></div>
<div class="pop-venda" id="popVenda"></div>
<div class="barra-visita" id="barraVisita"></div>
<button class="aviso-versao" id="avisoVersao">🌱 Nova versão <b></b> disponível! <span>Toque para atualizar</span></button>
<div class="fila-ui" id="filaUI"></div>
<div class="barra-construcao" id="barraConstrucao"></div>
<div class="tip" id="tip"></div>
<div class="toast-area" id="toasts"></div>

<!-- Janelas -->
<div class="fundo" id="fundo">
  <div class="janela">
    <div class="jtopo"><h2 id="jtitulo"></h2><button class="fechar" data-acao="fechar">✕</button></div>
    <div class="abas" id="jabas"></div>
    <div class="jcorpo" id="jcorpo"></div>
  </div>
</div>

<script src="assets/lib/three.min.js"></script>
<script src="assets/lib/OrbitControls.js"></script>
<script src="assets/lib/RoomEnvironment.js"></script>
<script src="assets/lib/supabase.js"></script>
<script src="js/icones.js"></script>
<script src="js/audio.js"></script>
<script src="js/game.js"></script>
</body>
</html>
